<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Snortleblat - Swamp Beast Diplomat">
    <meta property="og:description" content="A powerful Swamp Beast Diplomat battling and leveling up.">
    <meta property="og:image" content="images/snortleblat.webp">
    <meta property="og:type" content="website">
    <title>Character Card</title>
    <link href="styles/charactercard.css" rel="stylesheet">
    <script src="javascript/charactercard.js" defer></script>
</head>
<body>
    <section class="card">
        <img class="image" src="images/snortleblat.webp">
        <p class="name">Snortleblat</p>
        <div class="stats">
            <p id="class">Class: </p>
            <p id="level">Level: </p>
            <p id="health">Health: </p>
        </div>
        <div class="buttons">
            <button id="attacked">Attacked</button>
            <button id="levelUp">Level Up</button>
        </div>
    </section>
</body>
</html>
